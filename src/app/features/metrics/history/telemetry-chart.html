@if (coords().length === 0) {
  <p class="flex h-44 items-center justify-center rounded-[2px] border border-dashed border-[#e5eeff] text-[12px] text-[#44474d]">
    Sin lecturas en el periodo.
  </p>
} @else {
  <div
    class="relative rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#006398]"
    tabindex="0"
    role="group"
    [attr.aria-label]="label() + '. Usa las flechas para recorrer las lecturas.'"
    (keydown)="onKeydown($event)"
    (focus)="hovered.set(coords().length - 1)"
    (blur)="hovered.set(null)"
  >
    <svg
      #svg
      class="block w-full h-auto touch-none select-none"
      [attr.viewBox]="'0 0 ' + width + ' ' + height"
      aria-hidden="true"
      (pointermove)="onPointerMove($event, svg)"
      (pointerleave)="hovered.set(null)"
    >
      <!-- Grid + y axis -->
      @for (tick of yTicks(); track tick.y) {
        <line [attr.x1]="plotLeft" [attr.x2]="plotRight" [attr.y1]="tick.y" [attr.y2]="tick.y" stroke="#e5eeff" stroke-width="1" />
        <text
          [attr.x]="plotLeft - 6"
          [attr.y]="tick.y"
          text-anchor="end"
          dominant-baseline="middle"
          class="fill-[#74777e] font-['Space_Grotesk'] text-[10px] font-medium"
        >{{ tick.label }}</text>
      }

      <!-- X axis -->
      @for (tick of xTicks(); track tick.x) {
        <text
          [attr.x]="tick.x"
          [attr.y]="height - 6"
          [attr.text-anchor]="tick.anchor"
          class="fill-[#74777e] font-mono text-[10px] font-bold"
        >{{ tick.label }}</text>
      }

      <!-- Series -->
      <path [attr.d]="areaPath()" [attr.fill]="color()" fill-opacity="0.1" />
      <path [attr.d]="linePath()" fill="none" [attr.stroke]="color()" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

      <!-- Peak marker + label -->
      @if (peak(); as p) {
        <circle [attr.cx]="p.x" [attr.cy]="p.y" r="4" [attr.fill]="color()" stroke="#f8f9ff" stroke-width="2" />
        <text
          [class.invisible]="active() !== null"
          [attr.x]="p.x"
          [attr.y]="p.y - 8"
          [attr.text-anchor]="p.x > plotRight - 40 ? 'end' : p.x < plotLeft + 40 ? 'start' : 'middle'"
          class="fill-[#001229] font-['Space_Grotesk'] text-[10px] font-bold"
        >Pico {{ format(p.v) }}</text>
      }

      <!-- Crosshair -->
      @if (active(); as a) {
        <line [attr.x1]="a.x" [attr.x2]="a.x" [attr.y1]="12" [attr.y2]="baseline" stroke="#74777e" stroke-width="1" />
        <circle [attr.cx]="a.x" [attr.cy]="a.y" r="4" [attr.fill]="color()" stroke="#f8f9ff" stroke-width="2" />
      }
    </svg>

    @if (active(); as a) {
      <div
        class="pointer-events-none absolute top-0 z-10 -translate-x-1/2 rounded-[2px] border border-[rgba(196,198,206,0.4)] bg-white px-2 py-1 shadow-[0px_1px_3px_0px_rgba(0,0,0,0.1)] whitespace-nowrap"
        [style.left.%]="(a.x / width) * 100"
        aria-live="polite"
      >
        <p class="font-['Space_Grotesk'] font-bold text-[12px] leading-4 text-[#001229]">{{ format(a.v) }}</p>
        <p class="flex items-center gap-1 font-mono text-[10px] leading-3 text-[#44474d]">
          <span class="inline-block h-0.5 w-2.5" [style.background-color]="color()" aria-hidden="true"></span>
          {{ time(a.t) }} UTC
        </p>
      </div>
    }
  </div>

  <details class="mt-2 text-[11px] text-[#44474d]">
    <summary class="cursor-pointer font-['Space_Grotesk'] font-semibold rounded-sm focus-visible:outline-2 focus-visible:outline-[#006398]">
      Ver datos
    </summary>
    <div class="mt-1 max-h-40 overflow-y-auto">
      <table class="w-full text-left">
        <caption class="sr-only">{{ label() }}</caption>
        <thead>
          <tr>
            <th scope="col" class="py-0.5 font-semibold">Hora (UTC)</th>
            <th scope="col" class="py-0.5 text-right font-semibold">Valor</th>
          </tr>
        </thead>
        <tbody>
          @for (p of points(); track p.t) {
            <tr class="border-t border-[#e5eeff]">
              <td class="py-0.5 font-mono">{{ time(p.t) }}</td>
              <td class="py-0.5 text-right">{{ format(p.v) }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </details>
}
